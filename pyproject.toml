#
# Build system requirements
#
[build-system]

requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

#
#
# Basic project metadata
#
[project]

name = "nucleosome_spatial_analysis"

description = "Nucleosome Spatial Analysis"

version = "0.0.3"

readme = "README.md"

requires-python = ">=3.11"

license = {file = "LICENSE"}

keywords = [
  "spatial analysis",
  "nucleosome"
]

authors = [
  {name = "Claude Sonnet 5", email = "noreply@anthropic.com"},
  {name = "ChatGPT GPT-5", email = "noreply@openai.com"},
  {name = "Dimitrios Bellos", email = "dimitrios.bellos@rfi.ac.uk" },
    {name = "Jeongyoon Choi", email = "jeongyoon.choi@bioch.ox.ac.uk" },
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache-2.0 License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "numpy",
  "matplotlib",
  "scipy",
  "starfile",
  "joblib"
]

#
# Project urls
#
[project.urls]

"Source" = "https://github.com/rosalindfranklininstitute/Nucleosome_Spatial_Analysis_supplementary"
"Tracker" = "https://github.com/rosalindfranklininstitute/Nucleosome_Spatial_Analysis_supplementary/issues"

#
# Project command line scripts
#
[project.scripts]

voronoi = "voronoi:main"

#
# Configure setup tools
#
[tool.setuptools.packages.find]

where = ["src"]
